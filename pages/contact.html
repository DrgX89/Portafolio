                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label text-white">Mensaje</label>
                                    <textarea class="form-control bg-secondary border-secondary text-white" id="message" rows="5" placeholder="Tu mensaje..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-warning text-dark fw-bold w-100">Enviar mensaje</button>
