<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="4;url=./pages/index.html">
    <title>Cargando — Nixcobt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden;background:#000;font-family:'Roboto Mono', monospace}
        /* FONDO ROJO FLUOR + BLUR */
        .bg {
            position:fixed;inset:0;
            background:
                radial-gradient(ellipse 900px 600px at 50% 35%, #ff073a 0%, #ff0033 18%, #990011 42%, #1a0005 72%, #050005 100%),
                linear-gradient(180deg, #1a0005 0%, #000 100%);
            filter: contrast(1.25) saturate(1.3);
        }
        .bg::after{
            content:'';
            position:absolute;inset:0;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
            backdrop-filter: blur(0.7px);
        }
        /* Vignette + flare */
        .vignette{
            position:fixed;inset:0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.9) 95%);
            pointer-events:none;
        }
        .flare{
            position:fixed;
            width:900px;height:700px;
            left:50%;top:18%;
            transform:translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(255,7,58,0.55) 0%, rgba(255,0,60,0.25) 35%, transparent 70%);
            filter: blur(28px);
            pointer-events:none;
            animation: flarePulse 2.2s ease-in-out infinite;
        }
        @keyframes flarePulse{0%,100%{opacity:0.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}

        /* SCANLINES TV */
        .scanlines{
            position:fixed;inset:0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.07) 0px,
                rgba(255,255,255,0.07) 1px,
                transparent 2px,
                transparent 5px
            );
            opacity:0.45;
            pointer-events:none;
            animation: scanMove 7s linear infinite;
        }
        .scanlines::before{
            content:'';
            position:absolute;inset:0;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                rgba(255,7,58,0.03) 1px,
                transparent 3px
            );
        }
        @keyframes scanMove{0%{transform:translateY(0)}100%{transform:translateY(10px)}}

        /* Ruido TV sutil */
        .noise{
            position:fixed;inset:0;
            opacity:0.09;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
            pointer-events:none;
            animation: noiseShift 0.18s steps(4) infinite;
        }
        @keyframes noiseShift{0%{transform:translate(0,0)}25%{transform:translate(-1%,1%)}50%{transform:translate(1%,-0.5%)}75%{transform:translate(-0.5%,-1%)}100%{transform:translate(0,0)}}

        /* Barras horizontales glitch */
        .bars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
        .bars span{
            position:absolute;left:0;width:100%;height:2px;opacity:0.7;animation: barGlitch 0.35s steps(2) infinite;
        }
        .bars span:nth-child(1){top:18%;background:#ffd700;box-shadow:0 0 8px #ffd700;animation-delay:0s;height:3px}
        .bars span:nth-child(2){top:42%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation-delay:0.07s}
        .bars span:nth-child(3){top:67%;background:#00ffff;box-shadow:0 0 8px #00ffff;animation-delay:0.13s;height:2px}
        .bars span:nth-child(4){top:81%;background:#ffd700;opacity:0.4;height:1px;animation-delay:0.2s}
        .bars span:nth-child(5){top:28%;background:#00ff88;opacity:0.35;height:1px;animation-delay:0.11s}
        @keyframes barGlitch{
            0%{transform:translateX(0) scaleX(1);clip-path:inset(0 0 0 0)}
            20%{transform:translateX(-12px) scaleX(1.08);clip-path:inset(0 0 0 0)}
            40%{transform:translateX(10px) scaleX(0.92);clip-path:inset(0 15% 0 0)}
            60%{transform:translateX(-6px) scaleX(1.04);clip-path:inset(0 0 0 20%)}
            80%{transform:translateX(4px) scaleX(0.98)}
            100%{transform:translateX(0) scaleX(1)}
        }

        /* CONTENIDO CENTRO */
        .center{
            position:fixed;inset:0;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            z-index:5;text-align:center;padding:2rem;
        }
        .label-top{
            font-size:0.75rem;letter-spacing:0.45em;color:rgba(255,255,255,0.85);
            text-transform:uppercase;margin-bottom:1.2rem;
            text-shadow:0 0 8px rgba(255,7,58,0.9);
            animation: flickerTop 0.22s steps(2) infinite;
        }
        @keyframes flickerTop{0%{opacity:0.9}50%{opacity:1}100%{opacity:0.85}}

        /* CARGANDO GLITCH TRICOLOR */
        .glitch{
            font-family:'Bebas Neue', cursive;
            font-size: clamp(3.5rem, 14vw, 8.5rem);
            line-height:0.9;
            letter-spacing:0.08em;
            color:#fff;
            position:relative;
            text-transform:uppercase;
            filter: drop-shadow(0 0 18px rgba(255,7,58,0.9)) drop-shadow(0 0 35px rgba(255,7,58,0.5));
            animation: skewGlitch 0.7s steps(2) infinite;
        }
        .glitch::before,
        .glitch::after{
            content:attr(data-text);
            position:absolute;inset:0;
            overflow:hidden;
        }
        /* Amarillo */
        .glitch::before{
            color:#ffd700;
            left:-2px;
            text-shadow:-2px 0 #ffd700, 0 0 10px #ffd700;
            clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%);
            animation: glitchA 0.32s steps(2) infinite;
            opacity:0.95;
        }
        /* Azul/Cyan + Verde mezcla */
        .glitch::after{
            color:#00ffff;
            left:2px;
            text-shadow: 2px 0 #00ff88, -1px 0 #00ffff, 0 0 10px #00ffff;
            clip-path: polygon(0 62%, 100% 62%, 100% 100%, 0 100%);
            animation: glitchB 0.36s steps(2) infinite;
            opacity:0.95;
        }
        /* capa verde extra */
        .glitch span{
            position:relative;
            color:#fff;
            text-shadow: 0 0 12px rgba(0,255,136,0.7);
        }
        .glitch span::after{
            content:attr(data-text);
            position:absolute;inset:0;
            color:#00ff88;
            clip-path: polygon(0 38%, 100% 38%, 100% 62%, 0 62%);
            text-shadow: 1px 0 #00ff88, 0 0 8px #00ff88;
            animation: glitchMid 0.28s steps(2) infinite;
            opacity:0.9;
        }
        @keyframes glitchA{
            0%{clip-path:polygon(0 5%,100% 5%,100% 20%,0 20%);transform:translate(0)}
            30%{clip-path:polygon(0 30%,100% 30%,100% 45%,0 45%);transform:translate(-2px,1px)}
            60%{clip-path:polygon(0 15%,100% 15%,100% 35%,0 35%);transform:translate(1px,-1px)}
            100%{clip-path:polygon(0 40%,100% 40%,100% 55%,0 55%);transform:translate(-1px,0)}
        }
        @keyframes glitchB{
            0%{clip-path:polygon(0 65%,100% 65%,100% 80%,0 80%);transform:translate(1px,0)}
            35%{clip-path:polygon(0 25%,100% 25%,100% 40%,0 40%);transform:translate(-1px,0)}
            70%{clip-path:polygon(0 85%,100% 85%,100% 100%,0 100%);transform:translate(2px,1px)}
            100%{clip-path:polygon(0 50%,100% 50%,100% 70%,0 70%);transform:translate(0,-1px)}
        }
        @keyframes glitchMid{
            0%{clip-path:polygon(0 38%,100% 38%,100% 48%,0 48%);transform:translate(0)}
            50%{clip-path:polygon(0 52%,100% 52%,100% 62%,0 62%);transform:translate(1px,0)}
            100%{clip-path:polygon(0 42%,100% 42%,100% 58%,0 58%);transform:translate(-1px,0)}
        }
        @keyframes skewGlitch{
            0%{transform:skew(0deg)}
            15%{transform:skew(0.6deg)}
            30%{transform:skew(-0.7deg)}
            45%{transform:skew(0.3deg)}
            100%{transform:skew(0)}
        }

        .sub{
            margin-top:0.9rem;
            font-size: clamp(0.75rem, 2.2vw, 1rem);
            letter-spacing:0.35em;
            color:rgba(255,255,255,0.92);
            text-transform:uppercase;
            text-shadow:0 0 10px rgba(255,255,255,0.6), 0 0 18px rgba(255,7,58,0.7);
            animation: subFlicker 0.16s steps(2) infinite;
        }
        @keyframes subFlicker{0%{opacity:0.95}100%{opacity:1}}

        /* Barra de carga */
        .progress-wrap{
            margin-top:2.2rem;
            width:min(420px, 78vw);
            height:4px;
            background: rgba(255,255,255,0.12);
            border:1px solid rgba(255,255,255,0.18);
            border-radius:99px;
            overflow:hidden;
            box-shadow:0 0 12px rgba(255,7,58,0.5), inset 0 0 6px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
        }
        .progress-bar{
            height:100%;width:0%;
            background: linear-gradient(90deg, #ffd700 0%, #00ff88 50%, #00ffff 100%);
            box-shadow:0 0 12px rgba(255,215,0,0.7), 0 0 18px rgba(0,255,136,0.6);
            animation: load 3.6s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        @keyframes load{
            0%{width:0%}
            18%{width:22%}
            42%{width:48%}
            68%{width:78%}
            84%{width:88%}
            100%{width:100%}
        }
        .percent{
            margin-top:0.7rem;
            font-size:0.78rem;letter-spacing:0.28em;
            color:#ffd700;
            text-shadow:0 0 8px #ffd700, 0 0 14px rgba(0,255,136,0.5);
            font-weight:700;
        }
        .hint{
            margin-top:1.6rem;
            font-size:0.72rem;letter-spacing:0.18em;
            color:rgba(255,255,255,0.72);
            text-transform:uppercase;
        }
        .hint a{
            color:#00ff88;text-decoration:none;border-bottom:1px dashed rgba(0,255,136,0.6);padding-bottom:1px;
            text-shadow:0 0 8px rgba(0,255,136,0.6);
        }
        .hint a:hover{color:#ffd700;border-color:#ffd700;text-shadow:0 0 8px #ffd700}

        /* Borde TV */
        .tv-border{
            position:fixed;inset:0;
            border: 1px solid rgba(255,7,58,0.18);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.85), inset 0 0 120px rgba(255,7,58,0.12);
            pointer-events:none;
        }
        /* Parpadeo de encendido */
        .power-on{
            position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;
            animation: powerOn 0.45s ease 0.05s;
        }
        @keyframes powerOn{
            0%{opacity:1;transform:scaleY(0.02)}
            18%{opacity:1;transform:scaleY(1)}
            30%{opacity:0.9}
            55%{opacity:0}
            100%{opacity:0}
        }
        @media (max-width:480px){
            .glitch{font-size: clamp(3rem, 18vw, 5.5rem)}
            .progress-wrap{width:82vw}
        }
        @media (prefers-reduced-motion: reduce){
            .glitch,.glitch::before,.glitch::after,.glitch span::after,.bars span,.scanlines,.noise,.flare{animation:none}
            .progress-bar{animation: load 3.6s linear forwards}
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="flare"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="vignette"></div>
    <div class="tv-border"></div>
    <div class="power-on"></div>

    <div class="center">
        <div class="label-top">● REC • NIXCOBT SYSTEM • 1080i</div>
        <h1 class="glitch" data-text="CARGANDO"><span data-text="CARGANDO">CARGANDO</span></h1>
        <div class="sub">Iniciando transmisión_</div>

        <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
        <div class="percent" id="pct">0%</div>

        <div class="hint">Serás redirigido en 4 segundos — <a href="./pages/index.html">entrar ahora</a></div>
    </div>

    <script>
        // Contador %
        let p=0, el=document.getElementById('pct'), bar=document.getElementById('bar');
        const iv=setInterval(()=>{
            p+= Math.random()*9+3;
            if(p>=100){p=100; clearInterval(iv);}
            el.textContent=Math.floor(p)+'%';
            // sutil distorsión del texto en cada tick
            const g=document.querySelector('.glitch');
            if(Math.random()>0.78){g.style.transform='translate('+ (Math.random()*4-2)+'px,'+(Math.random()*2-1)+'px) skew('+(Math.random()*1.2-0.6)+'deg)'; setTimeout(()=>g.style.transform='',60)}
        },110);

        // Glitch aleatorio extra del sub
        const sub=document.querySelector('.sub');
        setInterval(()=>{
            if(Math.random()>0.82){
                const vals=['Iniciando transmisión_','Cargando sistema_','Conectando_','Sincronizando_'];
                sub.textContent=vals[Math.floor(Math.random()*vals.length)];
                sub.style.textShadow='0 0 8px #ffd700, 0 0 14px #00ff88';
                setTimeout(()=>sub.style.textShadow='',120);
            }
        },220);

        // Redirect
        const dest="./pages/index.html";
        let redirected=false;
        function go(){ if(redirected) return; redirected=true; document.body.style.transition='filter 0.3s'; document.body.style.filter='contrast(1.5) brightness(1.2) hue-rotate(10deg)'; setTimeout(()=>window.location.href=dest, 220); }
        setTimeout(go, 3600);
        // Click para saltar
        document.addEventListener('click', go);
        document.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') go(); });
    </script>
</body>
</html>
